name: Test basic push bump
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/master
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git config and package.json
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a package.json if not present
          if [ ! -f package.json ]; then
            echo '{"name":"test-pkg","version":"1.0.0"}' > package.json
            git add package.json
            git commit -m "fix: initial package.json" || true
          fi

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          user: "Test User"
          email: "test@example.com"
          branch: "master"
        continue-on-error: true

      - name: Assert action ran (version output or graceful failure)
        env:
          VERSION: ${{ steps.action.outputs.version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          # The action may fail if there's no meaningful bump commit,
          # but it should at least run and produce an outcome
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded with version: $VERSION"
            if [ -z "$VERSION" ]; then
              echo "WARN: version output is empty on success"
            fi
          else
            echo "Action did not succeed (may be expected if no bump commit found)"
          fi
          echo "PASS: action ran without crashing unexpectedly"
